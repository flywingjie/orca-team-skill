# 最小示例 DAG：一个功能从规格到验收
# 只演示结构与字段，不含任何业务口径。
#
# 约定：task id 就是「工单单号」，必须与 tickets/ 下对应工单标题里的单号一致。
# 该不变量由 scripts/check_consistency.py 校验（工单 ↔ DAG 四类比对）。

[orchestration]
name = "example-minimal"
max_parallel = 4

[[tasks]]
id = "SPEC-001"
role = "designer"
agent = "claude"
model = "example-strong-model"
model_family = "family-a"
worktree = "wt-SPEC-001"
files = ["specs/example/spec.md"]
depends_on = []
prompt = """产出示例功能的规格草稿：目标、非目标、验收标准、待拍板问题。
每条规格必须可验收。不改代码。"""

[[gates]]
id = "spec-gate"
after = "SPEC-001"
action = "pause"
escalate_to = "owner"
note = "规格与业务口径由拍板人确认。"

[[tasks]]
id = "CTR-001"
role = "designer"
agent = "claude"
model = "example-strong-model"
model_family = "family-a"
worktree = "wt-CTR-001"
files = ["contracts/example.py"]
depends_on = ["SPEC-001"]
run_after_gate = "spec-gate"
prompt = """依据规格定义契约：请求/响应模型、错误码。
本单是契约定义的唯一写入方；不生成契约产物。"""

[[tasks]]
id = "API-014"
role = "implementer"
agent = "pi"
model = "example-code-model-a"
model_family = "family-b"
worktree = "wt-API-014"
files = ["server/example.py", "server/tests/test_example.py"]
depends_on = ["CTR-001"]
prompt = """依据规格与契约实现后端与测试。
零 commit；交付补丁包（manifest + change.patch + evidence）。
只改本单 files 列表内的文件；越界即停。"""

[[tasks]]
id = "WEB-021"
role = "implementer"
agent = "pi"
model = "example-code-model-b"
model_family = "family-c"
worktree = "wt-WEB-021"
files = ["web/src/example.tsx", "web/src/example.test.tsx"]
depends_on = ["CTR-001"]
prompt = """依据规格与契约实现前端与测试。
零 commit；交付补丁包。
不得手写契约产物；只改本单 files 列表内的文件。"""

[[tasks]]
id = "INT-001"
role = "integrator"
agent = "claude"
model = "example-strong-model"
model_family = "family-a"
worktree = "wt-INT-001"
files = ["contracts/generated/", "server/routes.py"]
depends_on = ["API-014", "WEB-021"]
base_branch = "feature/example-integration"
run_after_gate = "spec-gate"
prompt = """合入前后端补丁；统一生成契约产物；跑全量门禁。
冲突涉及契约定义时回退 CTR-001 单，不在本单自行改。
产出补丁包与门禁实跑结果。"""

[[gates]]
id = "design-gate"
after = "INT-001"
action = "pause"
escalate_to = "owner"
note = "实现与契约产物一致、门禁通过后放行。"

[[tasks]]
id = "VER-001"
role = "verifier"
agent = "pi"
model = "example-code-model-b"
model_family = "family-c"
worktree = "wt-VERIFY"
files = ["tests/acceptance/"]
depends_on = ["INT-001"]
base_branch = "feature/example-integration"
run_after_gate = "design-gate"
prompt = """基于集成分支跑用例与门禁，产出用例结果、缺陷清单与证据。
不改功能代码；失败显式写失败。"""

[[tasks]]
id = "ACC-001"
role = "verifier"
agent = "claude"
model = "example-strong-model"
model_family = "family-a"
worktree = "wt-VERIFY"
files = ["reports/acceptance.md"]
depends_on = ["VER-001"]
base_branch = "feature/example-integration"
prompt = """条款级核验规格与验证结果，产出验收结论、缺口与遗留风险。
不自行豁免偏差。"""

[[gates]]
id = "delivery-gate"
after = "ACC-001"
action = "pause"
escalate_to = "owner"
note = "拍板人签字后交付。"
