name: ci

on:
  push:
  pull_request:

jobs:
  selftest:
    name: selftest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 24 项断言：结构/一致性 + 三关夹具端到端 + 集成关临时仓端到端
      - name: Run selftest
        run: python scripts/selftest.py
